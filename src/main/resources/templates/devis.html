<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Devis</title>
</head>
<body>
<h1>Devis de la demande</h1>

<section>
    <h2>Demande</h2>
    <p>
        <strong>Client:</strong>
        <span th:text="${demande.client.nom}">Client</span>
    </p>
    <p>
        <strong>Lieu:</strong>
        <span th:text="${demande.lieu}">Lieu</span>
    </p>
    <p>
        <strong>Date:</strong>
        <span th:text="${demande.dateDemande}">Date</span>
    </p>
</section>

<section>
    <h2>Liste des devis</h2>
    <ul>
        <li th:each="devis : ${devisList}">
            <span th:text="${devis.description}">Objet</span> -
            <span th:text="${devis.montant}">0</span>
            <span th:if="${devis.dateDevis}"> | <span th:text="${devis.dateDevis}">2026-05-31</span></span>
            <form th:action="@{/devis/{id}/accepter(id=${devis.id})}" method="post" style="display:inline;">
                <button type="submit">Accepter</button>
            </form>
            <form th:action="@{/devis/{id}/refuser(id=${devis.id})}" method="post" style="display:inline;">
                <button type="submit">Refuser</button>
            </form>
        </li>
    </ul>
</section>

<p>
    <a th:href="@{/demandes/{id}/devis/nouveau(id=${demande.id})}">Ajouter un devis</a>
</p>
<p><a th:href="@{/demandes}">Retour a la liste</a></p>
</body>
</html>

<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Devis</title>
</head>
<body>
<h1>Devis de la demande</h1>

<p th:if="${message}" th:text="${message}">Message</p>

<section>
    <h2>Demande</h2>
    <p>
        <strong>Client:</strong>
        <span th:text="${demande.client.nom}">Client</span>
    </p>
    <p>
        <strong>Lieu:</strong>
        <span th:text="${demande.lieu}">Lieu</span>
    </p>
    <p>
        <strong>Date:</strong>
        <span th:text="${#temporals.format(demande.dateDemande, 'yyyy-MM-dd HH:mm')}">Date</span>
    </p>
</section>

<section>
    <h2>Liste des devis</h2>
    <ul>
        <li th:each="devis : ${devisList}">
            <span th:text="${devis.description}">Type</span> -
            <span th:text="${devis.montant}">0</span>
            <span th:if="${devis.qte}"> | <span th:text="${devis.qte}">1</span></span>
            <span th:if="${devis.dateDevis}"> | <span th:text="${#temporals.format(devis.dateDevis, 'yyyy-MM-dd HH:mm')}">2026-05-31 10:30</span></span>
        </li>
    </ul>
</section>

<section>
    <h2>Validation</h2>
    <form th:action="@{/demandes/{id}/devis/accepter(id=${demande.id})}" method="post" style="display:inline;">
        <button type="submit">Valider les devis</button>
    </form>
    <form th:action="@{/demandes/{id}/devis/refuser(id=${demande.id})}" method="post" style="display:inline;">
        <button type="submit">Refuser les devis</button>
    </form>
    <form th:action="@{/demandes/{id}/travail/terminer(id=${demande.id})}" method="post" style="display:inline;">
        <button type="submit">Terminer travail</button>
    </form>
</section>

<p>
    <a th:href="@{/demandes/{id}/devis/nouveau(id=${demande.id})}">Ajouter un devis</a>
</p>
<p><a th:href="@{/demandes}">Retour a la liste</a></p>
</body>
</html>

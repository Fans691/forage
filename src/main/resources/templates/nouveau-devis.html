<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nouveau devis</title>
</head>
<body>
<h1>Choisir une demande</h1>

<p th:if="${message}" th:text="${message}">Message</p>

<form id="refForm" th:action="@{/devis/nouveau/ref}" method="get">
    <label for="demandeRef">Reference demande</label>
    <input type="text" id="demandeRef" name="ref" placeholder="DM001" required>
</form>

<p><a th:href="@{/demandes}">Retour a la liste</a></p>

<script>
    const input = document.getElementById('demandeRef');
    const form = document.getElementById('refForm');

    function goToDemande() {
        const ref = input.value.trim();
        if (!ref) return;
        form.submit();
    }

    input.addEventListener('blur', goToDemande);
    input.addEventListener('keydown', (event) => {
        if (event.key === 'Enter') {
            event.preventDefault();
            goToDemande();
        }
    });
</script>
</body>
</html>
